name: SUMAPR

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  deterministic-memory-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate SUMAPR structure and learnings
        run: python3 tools/sumapr.py check
